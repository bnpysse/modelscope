[project]
name = "omni"
version = "0.1.0"
description = "天眼全息智导系统 V6.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.40.1",
    "pysocks>=1.7.1",
    "streamlit>=1.45.0",
    "plotly>=6.1.0",
    "modelscope>=1.39.1",
    "python-dotenv>=1.2.3",
    "akshare>=1.18.94",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "paramiko>=5.0.0",
    "pytest>=9.1.1",
]
